services:
   db:
    image: mcr.microsoft.com/mssql/server
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: 'Y'
    ports:
      - 1401:1433
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "select 1"]
      interval: 10s
      retries: 10

   octopus:
    image: octopusdeploy/octopusdeploy:latest
    environment:
       ACCEPT_EULA: "Y"
       ADMIN_USERNAME: ${OCTOPUS_ADMIN_USERNAME}
       ADMIN_PASSWORD: ${OCTOPUS_ADMIN_PASSWORD}
       DB_CONNECTION_STRING: "Server=db,1433;Initial Catalog=Octopus;Persist Security Info=False;User=sa;Password=${SA_PASSWORD};MultipleActiveResultSets=False;Connection Timeout=30;"
    ports:
    - 1322:8080
    - 10943:10943
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
   tentacle:
      image: octopusdeploy/tentacle:latest
      container_name: octopus-tentacle
      restart: always
      environment:
        - "ACCEPT_EULA=Y"
        - "ListeningPort=10933"
        - "ServerUrl=http://localhost:1322/"        # Replace with your Octopus Server URL
        - "ServerUsername=${OCTOPUS_ADMIN_USERNAME}"             # Replace with your Octopus API Key
        - "ServerPassword=${OCTOPUS_ADMIN_PASSWORD}"             # Replace with your Octopus API Key
        - "TargetName=dev-tentacle"         # Replace with the name of the Tentacle
        - "TargetEnvironment=dev"  # Replace with the environment names (comma-separated)
        - "TargetRole=dev-role"               # Replace with the roles for the Tentacle (comma-separated)
        - "ServerThumbprint=E190B1EE4C8DD7ECDF149E0A89271C087BF85F5C" # Replace with your Octopus Server's thumbprint
      volumes:
        - tentacle-data:/etc/octopus
      ports:
      - "10933:10933"
      depends_on:
        octopus:
          condition: service_healthy

volumes:
  tentacle-data: